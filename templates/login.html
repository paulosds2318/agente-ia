<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar — Atlas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark auth-logo" aria-hidden="true">A</div>
    <h1>Atlas</h1>
    <p id="auth-subtitle">Entre para acessar suas conversas.</p>
    <form id="auth-form">
      <label id="nome-label" hidden>Nome<input id="auth-nome" autocomplete="name"></label>
      <label>E-mail<input id="auth-email" type="email" autocomplete="email" required></label>
      <label>Senha<input id="auth-senha" type="password" autocomplete="current-password" required></label>
      <p id="auth-erro" class="auth-error" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
    {% if cadastro_ativo %}<button id="alternar-auth" class="auth-switch" type="button">Criar uma conta</button>{% endif %}
  </main>
<script>
let cadastro = false;
const form = document.getElementById("auth-form");
const alternar = document.getElementById("alternar-auth");
const nomeLabel = document.getElementById("nome-label");
const erro = document.getElementById("auth-erro");
if (alternar) alternar.addEventListener("click", () => {
  cadastro = !cadastro;
  nomeLabel.hidden = !cadastro;
  document.getElementById("auth-subtitle").textContent = cadastro ? "Crie sua conta pessoal." : "Entre para acessar suas conversas.";
  form.querySelector("button").textContent = cadastro ? "Cadastrar" : "Entrar";
  alternar.textContent = cadastro ? "Já tenho uma conta" : "Criar uma conta";
});
form.addEventListener("submit", async evento => {
  evento.preventDefault(); erro.textContent = "";
  const resposta = await fetch(cadastro ? "/cadastro" : "/login", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({nome: document.getElementById("auth-nome").value,
      email: document.getElementById("auth-email").value, senha: document.getElementById("auth-senha").value})
  });
  const dados = await resposta.json();
  if (!resposta.ok) { erro.textContent = dados.erro || "Não foi possível continuar."; return; }
  location.href = "/";
});
</script>
</body>
</html>
