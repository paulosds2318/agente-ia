name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m py_compile app.py main.py atlas/*.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip_audit -r requirements.txt
      - name: Detect common secret patterns
        shell: bash
        run: |
          if git grep -n -I -E 'AQ\.[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{30,}' -- ':!.env.example'; then
            echo "Potential secret found"
            exit 1
          fi
